<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f1ec;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f1ec;">
    <tr>
        <td align="center" style="padding:48px 16px;">
            <table role="presentation" width="440" cellpadding="0" cellspacing="0"
                   style="max-width:440px;width:100%;background-color:#ffffff;border:1px solid #c9c4b8;">
                <tr>
                    <td align="center" style="padding:36px 28px 32px;">
                        <p style="margin:0 0 28px;font-family:Georgia,'Times New Roman',serif;font-size:20px;line-height:1.4;color:#2a2722;text-align:center;">
                            {{title}}
                        </p>
                        <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:40px;font-weight:bold;letter-spacing:8px;line-height:1.2;color:#1f1c18;text-align:center;">
                            {{code}}
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
